<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Prime Property Services</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Website header -->
    <header>
        <h1>Prime Property Services</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Service enquiry section -->
        <section>
            <h2>Service Enquiry</h2>
            <p>
                Please complete the form below
                to enquire about our services.
            </p>

            <form id="enquiryForm">

                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName"
                       name="fullName" required>

                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email"
                       name="email" required>

                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone"
                       name="phone" required>

                <br><br>

                <label for="service">Select Service:</label>
                <select id="service" name="service" required>
                    <option value="">Choose a service</option>
                    <option value="cleaning">Cleaning</option>
                    <option value="gardening">Gardening</option>
                    <option value="pest-control">Pest Control</option>
                </select>

                <br><br>

                <label for="message">Enquiry Details:</label>
                <textarea id="message" name="message"
                          rows="5" required></textarea>

                <br><br>

                <button type="submit">Submit Enquiry</button>

            </form>

            <p id="enquiryResponse" role="status"></p>
        </section>
    </main>

    <!-- Website footer -->
    <footer>
        <p>&copy; 2026 Prime Property Services.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
